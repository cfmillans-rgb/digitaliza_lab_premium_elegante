# TEMPORAL: genera las capturas de los diseños de muestra y las sube a esta misma rama.
# Se borra (junto con herramientas/) antes de unir la rama a main.
name: Capturas de diseños de muestra (temporal)

on:
  push:
    branches: [demos-galeria]
    paths:
      - herramientas/capturas-demos.cjs
      - .github/workflows/capturas-demos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capturas-demos
  cancel-in-progress: true

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright y sharp (fuera del proyecto)
        run: |
          mkdir -p /tmp/cap
          cp herramientas/capturas-demos.cjs /tmp/cap/
          cd /tmp/cap
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 sharp@0.33
          npx playwright install --with-deps chromium
      - name: Capturar las portadas
        run: node /tmp/cap/capturas-demos.cjs "$GITHUB_WORKSPACE/src/_data/demos.json" "$GITHUB_WORKSPACE/herramientas/capturas"
      - name: Subir las capturas a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add herramientas/capturas
          git commit -m "Capturas de los diseños de muestra (automático)" || { echo "Sin cambios"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
